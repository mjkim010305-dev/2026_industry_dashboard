<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시연 영상 - ROS 2 + turtlebot3_manipulation</title>
<!-- 리뉴얼: design-refs/design-guide.md 적용. 기능 스크립트는 원본(original/demo-video.html)에 타임라인 · 크게 보기를 더했다. -->
<style>
/* ---------- 공통 토큰 ---------- */
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --surface-2: #F7F8FA;
  --text: #0E1726; --text-2: #5B6472; --line: #DEE1E5;
  --accent: #0066CC; --accent-fill: #0071E3; --on-accent: #FFFFFF;
  --appbar: rgba(14, 23, 38, 0.92); --appbar-text: #F2F4F7; --appbar-focus: #7FB8FF;
  --stage: #0B0F14; --stage-text: #E8ECF1;
  --ok: #1F7A45; --ok-bg: #E6F4EC; --danger: #C62828; --danger-bg: #FDECEC;
  --shadow: 0 0 1px rgba(14, 23, 38, 0.20), 0 2px 8px rgba(14, 23, 38, 0.06);
  --card-border: transparent;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B0F14; --surface: #151A21; --surface-2: #1C222B;
    --text: #F2F4F7; --text-2: #A9B1BD; --line: #2C3440;
    --accent: #2997FF; --accent-fill: #0071E3;
    --appbar: rgba(7, 10, 14, 0.88); --stage: #05070A;
    --ok: #5FD08A; --ok-bg: rgba(95, 208, 138, 0.12); --danger: #FF6B6B; --danger-bg: rgba(255, 107, 107, 0.12);
    --shadow: none; --card-border: #2C3440;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip {
  position: absolute; left: 16px; top: -100px; z-index: 100; padding: 12px 16px; border-radius: 999px;
  background: var(--surface); color: var(--text); font-weight: 600; text-decoration: none; box-shadow: var(--shadow);
}
.skip:focus { top: 10px; }

/* 상단 바 */
.appbar {
  position: sticky; top: 0; z-index: 20; background: var(--appbar); color: var(--appbar-text);
  backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
}
.appbar-in { max-width: 1280px; margin: 0 auto; padding: 8px 24px; display: flex; align-items: center; gap: 16px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; background: #0071E3; }
.appbar nav { margin-left: auto; min-width: 0; }
.appbar nav ul {
  list-style: none; margin: 0; padding: 4px; display: flex; gap: 2px;
  background: rgba(255, 255, 255, 0.08); border-radius: 999px; overflow-x: auto;
}
.appbar nav a {
  display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px;
  color: rgba(242, 244, 247, 0.80); text-decoration: none; font-size: 15px; font-weight: 500; white-space: nowrap;
  transition: background-color 0.2s, color 0.2s;
}
.appbar nav a:hover { background: rgba(255, 255, 255, 0.12); color: #FFFFFF; }
.appbar nav a[aria-current="page"] { background: #FFFFFF; color: #0E1726; font-weight: 600; }
.appbar nav a:focus-visible { outline: 3px solid var(--appbar-focus); outline-offset: 1px; }

/* 페이지 · 머리 · 카드 */
.page { max-width: 1280px; margin: 0 auto; padding: 32px 24px 56px; }
.page-head { margin: 0 0 24px; }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--accent); }
.page-head h1 { margin: 0 0 8px; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; }
.card {
  background: var(--surface); border: 1px solid var(--card-border); border-radius: 16px;
  box-shadow: var(--shadow); padding: 24px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; }
.card-head h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; min-width: 96px; padding: 0 20px; border-radius: 999px; cursor: pointer;
  font: inherit; font-size: 15px; font-weight: 600;
  color: var(--text); background: var(--surface); border: 1px solid var(--line);
  transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
}
.btn:hover { border-color: var(--text-2); }
.btn:active { transform: scale(0.98); }
.btn.primary { color: var(--on-accent); background: var(--accent-fill); border-color: var(--accent-fill); }
.btn.primary:hover { filter: brightness(1.08); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2); font-size: 14px; font-weight: 500; border: 1px solid var(--line);
}
@media (max-width: 640px) {
  .appbar-in { padding: 8px 16px; flex-wrap: wrap; }
  .appbar nav { margin-left: 0; width: 100%; }
  .page { padding: 24px 16px 40px; }
  .page-head h1 { font-size: 26px; line-height: 34px; }
  .card { padding: 16px; }
}

/* ---------- 이 페이지 ---------- */
.desc p { margin: 0; font-size: 18px; line-height: 28px; max-width: 72ch; }
.desc p.sub { margin-top: 4px; color: var(--text-2); font-size: 15px; line-height: 22px; }

.player { margin-top: 8px; }
.main-wrap { padding: 12px; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--stage); border-radius: 12px; }
.tile { position: absolute; inset: 0; background: #000; overflow: hidden; will-change: transform; transform-origin: top left; border-radius: 12px; }
.tile video { width: 100%; height: 100%; object-fit: contain; display: block; }
.tile .fail {
  display: none; position: absolute; inset: 0; background: var(--stage); color: var(--stage-text);
  align-items: center; justify-content: center; flex-direction: column; gap: 4px; text-align: center; padding: 12px;
  font-size: 14px; overflow-wrap: anywhere;
}
.tile .fail span { color: #A9B1BD; font-size: 13px; }
.tile.failed video { visibility: hidden; }
.tile.failed .fail { display: flex; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px 8px 4px; }
.bar .state {
  display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 12px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); font-size: 14px; font-weight: 500;
}
.bar .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--text-2); }
.now { font-weight: 600; }
.live { color: var(--text-2); font-size: 14px; margin-left: auto; }

.list-section { margin-top: 32px; }
.list-section h2 { margin: 0 0 12px; font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
.list { list-style: none; margin: 0; padding: 4px 4px 16px; display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x proximity; }
.list li { flex: 0 0 240px; scroll-snap-align: start; }
.cell {
  display: block; width: 100%; padding: 8px; font: inherit; color: var(--text); text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--card-border); border-radius: 14px; box-shadow: var(--shadow);
  transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
}
.cell:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.cell .frame { pointer-events: none; border-radius: 8px; }
.cell .tile { border-radius: 8px; }
.cell .name { display: flex; align-items: center; gap: 8px; padding: 10px 4px 4px; font-weight: 600; font-size: 15px; }
.cell .name::before {
  content: ""; width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 8px;
  border-color: transparent transparent transparent var(--accent);
}
/* 타임라인: 메인 영상 재생 위치 (끌어서 이동) */
.timeline { display: flex; align-items: center; gap: 12px; padding: 14px 8px 0; }
.tl-time { min-width: 44px; font-size: 13px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; text-align: center; }
.tl-track { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; height: 28px; }
.tl-track input[type="range"] {
  --pct: 0%; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none;
}
.tl-track input[type="range"]:disabled { cursor: default; opacity: 0.5; }
.tl-track input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 999px; background: linear-gradient(to right, var(--accent) var(--pct), var(--line) var(--pct));
}
.tl-track input[type="range"]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--line); }
.tl-track input[type="range"]::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--accent); }
.tl-track input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%;
  background: #FFFFFF; border: 2px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
}
.tl-track input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--accent); }
.tl-marks { position: absolute; left: 9px; right: 9px; top: 50%; height: 0; pointer-events: none; }
.tl-marks span { position: absolute; top: -7px; width: 2px; height: 14px; margin-left: -1px; border-radius: 1px; background: var(--text-2); opacity: 0.7; }
/* 크게 보기: 전체 화면(지원 안 하면 창 가득) */
.main-wrap:fullscreen, .main-wrap.is-big {
  display: flex; flex-direction: column; padding: 16px; background: #000; border-radius: 0; color: #F2F4F7;
}
.main-wrap.is-big { position: fixed; inset: 0; z-index: 200; }
.main-wrap:fullscreen .frame, .main-wrap.is-big .frame { flex: 1; aspect-ratio: auto; min-height: 0; border-radius: 0; }
.main-wrap:fullscreen .tile, .main-wrap.is-big .tile { border-radius: 0; }
.main-wrap:fullscreen .tl-time, .main-wrap.is-big .tl-time, .main-wrap:fullscreen .live, .main-wrap.is-big .live { color: #C9CED6; }
.main-wrap:fullscreen .bar .state, .main-wrap.is-big .bar .state { background: rgba(255, 255, 255, 0.1); border-color: transparent; color: #D2D7DE; }
.main-wrap:fullscreen .btn:not(.primary), .main-wrap.is-big .btn:not(.primary) { background: rgba(255, 255, 255, 0.1); color: #FFFFFF; border-color: rgba(255, 255, 255, 0.25); }
.frame { cursor: zoom-in; }
.main-wrap:fullscreen .frame, .main-wrap.is-big .frame { cursor: zoom-out; }
.cell .frame { cursor: pointer; }
/* intro 구간: 누르면 intro 영상의 재생 위치만 옮긴다 */
.chapters .cell.is-on { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.cell .stamp {
  position: absolute; right: 8px; bottom: 10px; z-index: 1; padding: 2px 6px; border-radius: 6px;
  background: rgba(0, 0, 0, 0.75); color: #FFFFFF; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.cell .seg { position: absolute; left: 0; bottom: 0; z-index: 1; height: 4px; width: 0; background: var(--accent); }
.empty { color: var(--text-2); background: var(--surface); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
</style>
</head>

<header class="appbar">
  <div class="appbar-in">
    <span class="brand"><span class="brand-mark" aria-hidden="true"></span>MoNa</span>
    <nav aria-label="화면 이동">
      <ul>
        <li><a href="demo-video.html" aria-current="page">시연 영상<span class="vh"> (현재 탭)</span></a></li>

<div class="page">
  <main id="main">
    <section class="desc page-head" aria-labelledby="t-desc">
      <p class="eyebrow">DEMO</p>
      <h1 id="t-desc">프로젝트 시연 영상</h1>
      <p>움직일 수 있는 장애물이 경로를 막고 있으면, 움직일 수 있는 장애물을 치우고 경로를 수행한다.</p>

    </section>

    <section class="player" aria-labelledby="t-player">
      <h2 id="t-player" class="vh">메인 플레이어</h2>
      <div class="main-wrap card is-main" id="mainWrap">
        <div class="frame" id="mainFrame" title="두 번 누르면 크게 보기"></div>
        <div class="timeline">
          <span class="tl-time" id="tlNow">0:00</span>
          <div class="tl-track">
            <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="재생 위치" disabled>
            <div class="tl-marks" id="tlMarks" aria-hidden="true"></div>
          </div>
          <span class="tl-time" id="tlDur">0:00</span>
        </div>
        <div class="bar">
          <button type="button" class="btn primary" id="toggle">일시정지</button>
          <button type="button" class="btn" id="bigBtn" aria-pressed="false">크게 보기</button>
          <span class="state" id="state" role="status">상태: 재생 중</span>
          <span class="now" id="nowName"></span>
          <span class="live" id="live" aria-live="polite"></span>
        </div>
      </div>

    <section class="list-section chapters" aria-labelledby="t-chapters" id="chapterSection" hidden>
      <h2 id="t-chapters">intro 구간</h2>
      <ul class="list" id="chapters"></ul>
    </section>

    <section class="list-section" aria-labelledby="t-list">
      <h2 id="t-list">영상 목록</h2>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>재생할 시연 영상이 없습니다. 영상 파일을 추가하면 여기에 나타납니다.</p>
    </section>

<script>
// 영상 목록: 항목을 추가하거나 바꾸려면 이 배열만 고친다.
const VIDEOS = [
  { name: "intro", path: "../data/intro.mp4" },
  { name: "data1", path: "../data/data1.mp4" },
  { name: "data2", path: "../data/data2.mp4" },
  { name: "data3", path: "../data/data3.mp4" },
  { name: "data4", path: "../data/data4.mp4" }
];
// intro 구간: start 는 초 단위 시작 시각(영상 속 장면 전환 기준). 구간 끝은 다음 구간의 start(마지막은 영상 끝).
const CHAPTER_VIDEO = "intro";
const CHAPTERS = [
  { title: "주요 기술 및 핵심 기술", start: 9 },
  { title: "기존 주행 (우회 주행)", start: 14.5 },
  { title: "로봇팔로 상자를 미는 시나리오", start: 22 },
  { title: "기대효과", start: 83 }
];
const DURATION = 300; // 0.3초

const mainFrame = document.getElementById('mainFrame');
const listEl = document.getElementById('list');
const toggle = document.getElementById('toggle');
const stateEl = document.getElementById('state');
const nowName = document.getElementById('nowName');
const live = document.getElementById('live');

let mainItem = null;
let slots = [];      // 목록 칸 순서: 각 칸이 가진 항목
let busy = false;

function makeTile(v) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  const video = document.createElement('video');
  video.muted = true; video.defaultMuted = true; video.loop = true; video.playsInline = true;
  video.preload = 'metadata'; video.tabIndex = -1;
  video.setAttribute('aria-hidden', 'true');
  video.src = v.path + '#t=0.001';
  const fail = document.createElement('div');
  fail.className = 'fail';
  fail.innerHTML = '<strong>영상을 불러올 수 없습니다</strong><span></span>';
  fail.lastChild.textContent = v.path;
  video.addEventListener('error', () => { tile.classList.add('failed'); if (v === mainItem) setState(); });
  tile.append(video, fail);
  v.tile = tile; v.video = video;
}

function cellFor(v, index) {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'cell';
  const fr = document.createElement('div'); fr.className = 'frame';
  const nm = document.createElement('span'); nm.className = 'name';
  b.append(fr, nm);
  b.addEventListener('click', () => select(index));
  li.appendChild(b);
  return li;
}

function labelCells() {
  [...listEl.children].forEach((li, i) => {
    const b = li.firstChild, v = slots[i];
    b.querySelector('.frame').appendChild(v.tile);
    b.querySelector('.name').textContent = v.name;
    b.setAttribute('aria-label', v.name + ' 재생');
  });
}

function setState() {
  const v = mainItem.video;
  const failed = mainItem.tile.classList.contains('failed');
  const playing = !failed && !v.paused;
  stateEl.textContent = failed ? '상태: 영상을 불러올 수 없음' : '상태: ' + (playing ? '재생 중' : '정지');
  toggle.textContent = playing ? '일시정지' : '재생';
  toggle.setAttribute('aria-label', (playing ? '일시정지' : '재생') + ': ' + mainItem.name);
  nowName.textContent = '현재 영상: ' + mainItem.name;
}

function playMain() {
  const p = mainItem.video.play();
  if (p && p.catch) p.catch(() => {});
}

function select(index) {
  if (busy) return;
  const picked = slots[index];
  const prev = mainItem;
  const pickedRect = picked.tile.getBoundingClientRect();
  const prevRect = prev.tile.getBoundingClientRect();

  prev.video.pause();
  slots[index] = prev;
  mainItem = picked;
  mainFrame.appendChild(picked.tile);
  labelCells();

  const nowPicked = picked.tile.getBoundingClientRect();
  const nowPrev = prev.tile.getBoundingClientRect();
  busy = true;
  const anim = (tile, from, to) => tile.animate([
    { transform: 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px) scale(' + (from.width / to.width) + ',' + (from.height / to.height) + ')' },
    { transform: 'none' }
  ], { duration: DURATION, easing: 'ease-in-out' });
  const a1 = anim(picked.tile, pickedRect, nowPicked);
  const a2 = anim(prev.tile, prevRect, nowPrev);
  picked.tile.style.zIndex = 2;
  const done = () => { picked.tile.style.zIndex = ''; busy = false; };
  Promise.all([a1.finished, a2.finished]).then(done, done);

  picked.video.currentTime = 0;
  picked.video.muted = true;
  playMain();
  prev.video.currentTime = 0.001;
  setState();
  live.textContent = '지금 재생 중: ' + picked.name;
  VIDEOS.forEach(v => v.markChapters && v.markChapters());
  drawMarks();
}

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

// intro 구간 목록: 썸네일은 각 구간 시작 장면, 누르면 intro 를 메인으로 올리고 그 시각으로 이동한다.
function buildChapters() {
  const host = VIDEOS.find(v => v.name === CHAPTER_VIDEO);
  if (!host || CHAPTERS.length === 0) return;
  const listCh = document.getElementById('chapters');
  const cells = CHAPTERS.map((c, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cell';
    b.setAttribute('aria-label', host.name + ' ' + fmtTime(c.start) + '부터 재생: ' + c.title);
    const fr = document.createElement('div'); fr.className = 'frame';
    const tile = document.createElement('div'); tile.className = 'tile';
    const video = document.createElement('video');
    video.muted = true; video.playsInline = true; video.preload = 'metadata'; video.tabIndex = -1;
    video.setAttribute('aria-hidden', 'true');
    video.src = host.path + '#t=' + Math.max(c.start, 0.001);
    const fail = document.createElement('div');
    fail.className = 'fail';
    fail.innerHTML = '<strong>영상을 불러올 수 없습니다</strong><span></span>';
    fail.lastChild.textContent = host.path;
    video.addEventListener('error', () => tile.classList.add('failed'));
    const stamp = document.createElement('span'); stamp.className = 'stamp'; stamp.textContent = fmtTime(c.start);
    const seg = document.createElement('span'); seg.className = 'seg';
    tile.append(video, fail);
    fr.append(tile, stamp, seg);
    const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = (i + 1) + '. ' + c.title;
    b.append(fr, nm);
    b.addEventListener('click', () => jumpTo(host, c.start));
    li.appendChild(b);
    listCh.appendChild(li);
    return { b, seg };
  });

  // 재생 위치에 맞춰 현재 구간을 표시하고, 구간 안에서 얼마나 진행했는지 막대로 보인다.
  const mark = () => {
    const v = host.video, t = v.currentTime, end = v.duration || Infinity;
    const onMain = host === mainItem;
    CHAPTERS.forEach((c, i) => {
      const next = i + 1 < CHAPTERS.length ? CHAPTERS[i + 1].start : end;
      const on = onMain && t >= c.start && t < next;
      cells[i].b.classList.toggle('is-on', on);
      if (on) cells[i].b.setAttribute('aria-current', 'true'); else cells[i].b.removeAttribute('aria-current');
      const pct = on && isFinite(next) && next > c.start ? (t - c.start) / (next - c.start) * 100 : 0;
      cells[i].seg.style.width = Math.min(100, pct) + '%';
    });
  };
  host.video.addEventListener('timeupdate', mark);
  host.video.addEventListener('seeked', mark);
  host.markChapters = mark;
  document.getElementById('chapterSection').hidden = false;
}

function jumpTo(v, sec) {
  if (v !== mainItem) {
    if (busy) return;
    select(slots.indexOf(v));
  }
  v.video.currentTime = sec;
  playMain();
  live.textContent = '지금 재생 중: ' + v.name + ' ' + fmtTime(sec);
}

// 타임라인: 메인 영상의 재생 위치를 보이고, 끌거나 눌러서 원하는 시각으로 옮긴다. ←/→ 는 5초씩.
const seek = document.getElementById('seek');
const tlNow = document.getElementById('tlNow');
const tlDur = document.getElementById('tlDur');
const tlMarks = document.getElementById('tlMarks');
let seeking = false;

function syncTimeline() {
  if (!mainItem) return;
  const v = mainItem.video, d = v.duration, ok = isFinite(d) && d > 0;
  seek.disabled = !ok;
  if (ok && +seek.max !== d) { seek.max = d; drawMarks(); }
  if (!seeking) seek.value = ok ? v.currentTime : 0;
  const t = seeking ? +seek.value : v.currentTime;
  tlNow.textContent = fmtTime(t);
  tlDur.textContent = ok ? fmtTime(d) : '0:00';
  seek.style.setProperty('--pct', ok ? Math.min(100, t / d * 100) + '%' : '0%');
  seek.setAttribute('aria-valuetext', tlNow.textContent + ' / ' + tlDur.textContent);
}

// intro 영상이면 구간 시작 위치에 눈금
function drawMarks() {
  tlMarks.textContent = '';
  const d = mainItem && mainItem.video.duration;
  if (!mainItem || mainItem.name !== CHAPTER_VIDEO || !(d > 0)) return;
  CHAPTERS.forEach(c => {
    const m = document.createElement('span');
    m.style.left = (c.start / d * 100) + '%';
    m.title = fmtTime(c.start) + ' ' + c.title;
    tlMarks.appendChild(m);
  });
}

function seekTo(sec) {
  const v = mainItem.video, d = v.duration;
  if (!(d > 0)) return;
  v.currentTime = Math.max(0, Math.min(d - 0.05, sec));
  syncTimeline();
}
seek.addEventListener('input', () => { seeking = true; seekTo(+seek.value); });
seek.addEventListener('change', () => { seeking = false; syncTimeline(); live.textContent = mainItem.name + ' ' + fmtTime(mainItem.video.currentTime) + ' 로 이동'; });
seek.addEventListener('pointerup', () => { seeking = false; });
seek.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  seekTo(mainItem.video.currentTime + (e.key === 'ArrowRight' ? 5 : -5));
});
(function loop() { syncTimeline(); requestAnimationFrame(loop); })();

// 크게 보기: 메인 플레이어(영상 + 타임라인 + 버튼)를 전체 화면으로. 전체 화면을 못 쓰면 창 가득. 영상을 두 번 눌러도 된다.
const bigBtn = document.getElementById('bigBtn');
const mainWrap = document.getElementById('mainWrap');
function isBig() { return document.fullscreenElement === mainWrap || mainWrap.classList.contains('is-big'); }
function showBig() {
  const on = isBig();
  bigBtn.textContent = on ? '작게 보기' : '크게 보기';
  bigBtn.setAttribute('aria-pressed', String(on));
}
function setBig(on) {
  if (on) {
    if (mainWrap.requestFullscreen) mainWrap.requestFullscreen().catch(() => { mainWrap.classList.add('is-big'); showBig(); });
    else mainWrap.classList.add('is-big');
  } else {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    mainWrap.classList.remove('is-big');
  }
  showBig();
}
bigBtn.addEventListener('click', () => setBig(!isBig()));
mainFrame.addEventListener('dblclick', () => setBig(!isBig()));
document.addEventListener('fullscreenchange', showBig);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && mainWrap.classList.contains('is-big')) setBig(false); });

toggle.addEventListener('click', () => {
  const v = mainItem.video;
  if (v.paused) playMain(); else v.pause();
  setState();
});

function init() {
  if (VIDEOS.length === 0) {
    document.getElementById('empty').hidden = false;
    document.querySelector('.player').hidden = true;
    return;
  }
  VIDEOS.forEach(makeTile);
  mainItem = VIDEOS[0];
  slots = VIDEOS.slice(1);
  mainFrame.appendChild(mainItem.tile);
  slots.forEach((v, i) => listEl.appendChild(cellFor(v, i)));
  labelCells();
  mainItem.video.preload = 'auto';
  mainItem.video.autoplay = true;
  mainItem.video.addEventListener('play', setState);
  VIDEOS.forEach(v => { v.video.addEventListener('play', () => { if (v === mainItem) setState(); }); v.video.addEventListener('pause', () => { if (v === mainItem) setState(); }); });
  live.textContent = '지금 재생 중: ' + mainItem.name;
  buildChapters();
  VIDEOS.forEach(v => v.video.addEventListener('loadedmetadata', () => { if (v === mainItem) drawMarks(); }));
  playMain();
  setState();
}
init();
</script>
</body>
